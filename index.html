<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: rgb(89, 89, 89);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 100%;
        }

        .box>div {
            margin: 10px;
        }

        .parent {
            /* cell size adapts to both screen width and height, capped at 90px */
            --cell: clamp(40px, min((100vw - 40px) / 6, (100dvh - 230px) / 5), 90px);
            display: grid;
            grid-template-columns: repeat(6, var(--cell));
            grid-auto-rows: var(--cell);
            background-color: #2196F3;
            padding: 10px;
            max-width: 100%;
        }

        .child {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffffcc;
            border: 1px solid #000000cc;
            font-size: calc(var(--cell) * 0.38);
            text-align: center;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .correct {
            background-color: #6ECB63;
        }

        .wrong {
            background-color: #EB1D36;
        }

        .start_btn,
        .reset_btn {
            display: inline-block;
            padding: 0.6em 1.05em;
            font-size: clamp(18px, 4.5vw, 24px);
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            outline: none;
            color: #fff;
            border: none;
            border-radius: 15px;
            box-shadow: 0 9px #999;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .start_btn {
            background-color: #4CAF50;
        }

        .start_btn:hover {
            background-color: #3e8e41;
        }

        .start_btn:active {
            background-color: #3e8e41;
            box-shadow: 0 5px #666;
            transform: translateY(4px);
        }

        .reset_btn {
            background-color: #f31010;
            display: none;
        }

        .reset_btn:hover {
            background-color: #f31010;
        }

        .reset_btn:active {
            background-color: #f31010;
            box-shadow: 0 5px #666;
            transform: translateY(4px);
        }

        .start_btn:focus-visible,
        .reset_btn:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 3px;
        }

        .timerBox {
            font-size: clamp(18px, 5vw, 25px);
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-style: groove;
            border-radius: 5px;
            padding: 10px;
            color: white;
            max-width: 100%;
        }

        .prevent-select {
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10 and IE 11 */
            user-select: none; /* Standard syntax */
        }

        footer {
            width: 100%;
            text-align: center;
        }

        footer p {
            margin: 0.5em 0;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="timerBox">Time &nbsp; <span class="timerDisplay"> 00 : 00 : 000 </span></div>
        <div class="parent prevent-select" id="parent"></div>
        <div>
            <button class="start_btn" id="start_btn">Start</button>
            <button class="reset_btn" id="reset_btn">Reset</button>
        </div>
    </div>
    <footer>
        <p> &copy;Dipraj Debnath</p>
    </footer>
</body>

<script>
    // start button
    document.getElementById('start_btn').addEventListener('click', () => {
        if (int !== null) {
            clearInterval(int);
        }
        int = setInterval(displayTimer, 10);

        // display the board
        addElement();
        count = 1;
        // hide start button
        document.getElementById('start_btn').style.display = 'none';
        // make reset button visible
        document.getElementById('reset_btn').style.display = 'block';
    });

    // reset button
    document.getElementById('reset_btn').addEventListener('click', () => {
        clearInterval(int);
        [milliseconds, seconds, minutes] = [0, 0, 0];
        timerRef.innerHTML = '00 : 00 : 000';

        // remove  child 
        const list = document.getElementById("parent");

        while (list.hasChildNodes()) {
            list.removeChild(list.firstChild);
        }
        // hide reset button
        document.getElementById('reset_btn').style.display = 'none';
        // make start button visible
        document.getElementById('start_btn').style.display = 'block';
    });

    // On clicking numbers verify
    let count = 1;
    function verify(div) {
        if (div.innerHTML == count) {
            div.classList.add('correct');
            if (count === 30) {
                clearInterval(int);
                // hide start button
                document.getElementById('start_btn').style.display = 'none';
                // make reset button visible
                document.getElementById('reset_btn').style.display = 'block';
            }
            count++;
        }
        else {
            div.classList.add('wrong');
            setTimeout(function () {
                div.classList.remove("wrong");
            }, 150);
        }
    }

    // Generate random numbers
    function myRandomInts(quantity, max) {
        const set = new Set()
        while (set.size < quantity) {
            set.add(Math.floor(Math.random() * max) + 1)
        }
        return set;
    }

    // Add elements to grid
    function addElement() {
        // remove existing child if present
        const list = document.getElementById("parent");

        while (list.hasChildNodes()) {
            list.removeChild(list.firstChild);
        }

        const randomList = myRandomInts(30, 30);
        randomList.forEach(function (value) {
            // create a new div element
            const newDiv = document.createElement("div");

            // add class child
            newDiv.classList.add("child");

            // add event listener
            newDiv.addEventListener('click', () => {
                verify(newDiv);
            });

            // give it some content
            const newContent = document.createTextNode(value);

            // add the text node to the newly created div
            newDiv.appendChild(newContent);

            // add the newly created element and its content into the DOM
            const currentDiv = document.getElementById("parent");
            currentDiv.insertAdjacentElement("beforeend", newDiv);
        });
    }

    // Timer Code
    let [milliseconds, seconds, minutes] = [0, 0, 0];
    let timerRef = document.querySelector('.timerDisplay');
    let int = null;


    function displayTimer() {
        milliseconds += 10;
        if (milliseconds == 1000) {
            milliseconds = 0;
            seconds++;
            if (seconds == 60) {
                seconds = 0;
                minutes++;
                if (minutes == 60) {
                    minutes = 0;
                }
            }
        }

        let m = minutes < 10 ? "0" + minutes : minutes;
        let s = seconds < 10 ? "0" + seconds : seconds;
        let ms = milliseconds < 10 ? "00" + milliseconds : milliseconds < 100 ? "0" + milliseconds : milliseconds;

        timerRef.innerHTML = ` ${m} : ${s} : ${ms}`;
    }
</script>

</html>
